<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CityCare Hospital - Patient Registration</title>

    <!-- CityCare Hospital Favicon -->
    <link rel="icon" type="png" href="images/favicon.png">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
    <img
        src="images/citycare-logo.png"
        alt="CityCare Hospital Logo"
        class="hospital-logo"
    >

    <h1>Patient Registration Portal</h1>

    <p>
        Welcome to CityCare Hospital
    </p>
</header>

    <main>

        <section class="registration-form">

            <h2>Patient Registration Form</h2>

            <form id="patientForm">

                <!-- Patient Name -->
                <label for="patientName">Patient Name:</label>

                <input
                    type="text"
                    id="patientName"
                    name="patientName"
                    placeholder="Enter patient name"
                    required
                    maxlength="50">

                <br><br>


                <!-- Date of Birth -->
                <label for="dob">Date of Birth:</label>

               <input
                     type="date"
                     id="dob"
                    name="dob"
                    required
                    min="1950-01-01"
                    max="2026-12-31">

                <br><br>


                <!-- Gender -->
                <label>Gender:</label>

                <input
                    type="radio"
                    id="male"
                    name="gender"
                    value="Male"
                    required>

                <label for="male">Male</label>

                <input
                    type="radio"
                    id="female"
                    name="gender"
                    value="Female">

                <label for="female">Female</label>

                <input
                    type="radio"
                    id="other"
                    name="gender"
                    value="Other">

                <label for="other">Other</label>

                <br><br>


                <!-- Mobile Number -->
                <label for="mobile">Mobile Number:</label>

                <input
                    type="tel"
                    id="mobile"
                    name="mobile"
                    placeholder="Enter 10-digit mobile number"
                    required
                    maxlength="10">

                <br><br>


                <!-- Email -->
                <label for="email">Email:</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter email address"
                    required>

                <br><br>


                <!-- Blood Group -->
                <label for="bloodGroup">Blood Group:</label>

                <select
                    id="bloodGroup"
                    name="bloodGroup"
                    required>

                    <option value="">Select Blood Group</option>
                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>

                </select>

                <br><br>


                <!-- Department -->
                <label for="department">Department:</label>

                <select
                    id="department"
                    name="department"
                    required>

                    <option value="">Select Department</option>
                    <option value="General Medicine">General Medicine</option>
                    <option value="Cardiology">Cardiology</option>
                    <option value="Orthopedics">Orthopedics</option>
                    <option value="Dermatology">Dermatology</option>
                    <option value="Pediatrics">Pediatrics</option>

                </select>

                <br><br>


                <!-- Address -->
                <label for="address">Address:</label>

                <textarea
                    id="address"
                    name="address"
                    rows="4"
                    cols="40"
                    placeholder="Enter your address"
                    required
                    maxlength="200"></textarea>

                <br><br>


                <!-- Password -->
                <label for="password">Password:</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter password"
                    required
                    minlength="8">

                <br><br>


                <!-- Confirm Password -->
                <label for="confirmPassword">Confirm Password:</label>

                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    placeholder="Confirm password"
                    required
                    minlength="8">

                <br><br>


                <!-- Patient Document -->
                <label for="document">Upload Patient ID Proof / Medical Document:</label>

                <input
                    type="file"
                    id="document"
                    name="document"
                    accept=".pdf,.jpg,.jpeg,.png"
                    required>

                <button type="button" id="removeFile">
                    Remove File
                </button>

                <p id="fileMessage"></p>

                <br><br>


                <!-- Consent -->
                <input
                    type="checkbox"
                    id="consent"
                    name="consent"
                    required>

                <label for="consent">
                    I agree to the hospital registration terms.
                </label>

                <br><br>


                <!-- Submit Button -->
               <button type="submit">
                Register Patient
                </button>

                <p id="validationMessage"></p>

            </form>

        </section>

    </main>


    <footer>

        <p>
            &copy; 2026 CityCare Hospital
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
